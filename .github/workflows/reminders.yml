name: Reminder emails
# Special-day reminders (Friday & al-Kahf, fasting days, seasons). The site decides whether today
# has an occasion; this only knocks twice a day. Needs repository secrets SITE_URL (e.g.
# https://example.com, no trailing slash) and CRON_SECRET (same value as on Vercel).
on:
  schedule:
    # Times are UTC. Cairo is UTC+2 in winter and UTC+3 in summer.
    - cron: "0 4 * * *" # morning: Friday, about 6–7 am in Cairo
    - cron: "0 16 * * *" # evening: tomorrow's fasting & seasons, about 6–7 pm in Cairo
  workflow_dispatch:
    inputs:
      slot:
        description: Which reminders
        type: choice
        options: [morning, evening]
        default: morning
      date:
        description: Pretend today is (YYYY-MM-DD, Cairo); empty = today
        required: false
      dryRun:
        description: Only count recipients, send nothing
        type: boolean
        default: true

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Send reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 4 * * *' && 'morning' || 'evening') || inputs.slot }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '0' }}
        run: |
          set -euo pipefail
          query="slot=${SLOT}"
          [ -n "${DATE}" ] && query="${query}&date=${DATE}"
          [ "${DRY_RUN}" = "1" ] && query="${query}&dryRun=1"
          # Each call sends for up to ~4 minutes, then reports what is left; call again until done.
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --fail-with-body --max-time 320 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${SITE_URL}/api/cron/reminders?${query}")
            echo "Attempt ${attempt}: ${body}"
            remaining=$(echo "${body}" | jq -r '.remaining // 0')
            if [ "${DRY_RUN}" = "1" ] || [ "${remaining}" = "0" ]; then exit 0; fi
          done
          echo "::warning::Stopped with ${remaining} reminders still unsent."
