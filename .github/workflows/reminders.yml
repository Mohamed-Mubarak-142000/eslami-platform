name: Reminder emails
# Special-day reminders (Friday & al-Kahf, fasting days, seasons). The site decides whether today
# has an occasion; this only knocks twice a day. Vercel Cron (vercel.json) sends them on time; this
# is the backup an hour later (GitHub schedules often run hours late), and finishes whatever is left. Needs repository secrets SITE_URL (e.g.
# https://example.com, no trailing slash) and CRON_SECRET (same value as on Vercel).
on:
  schedule:
    # Times are UTC. Cairo is UTC+2 in winter and UTC+3 in summer.
    - cron: "17 5 * * *" # morning backup: Friday, after Vercel's 04:00 run
    - cron: "17 17 * * *" # evening backup: tomorrow's fasting & seasons, after Vercel's 16:00 run
  workflow_dispatch:
    inputs:
      slot:
        description: Which reminders
        type: choice
        options: [morning, evening]
        default: morning
      date:
        description: Pretend today is (YYYY-MM-DD, Cairo); empty = today
        required: false
      dryRun:
        description: Only count recipients, send nothing
        type: boolean
        default: true

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Send reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 5 * * *' && 'morning' || 'evening') || inputs.slot }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '0' }}
        run: |
          set -euo pipefail
          query="slot=${SLOT}"
          [ -n "${DATE}" ] && query="${query}&date=${DATE}"
          [ "${DRY_RUN}" = "1" ] && query="${query}&dryRun=1"
          url="${SITE_URL%/}/api/cron/reminders?${query}"
          # Each call sends for up to ~4 minutes, then reports what is left; call again until done.
          for attempt in 1 2 3 4 5 6; do
            # Redirects are not followed: curl would drop the Authorization header, so SITE_URL must be
            # the final address (https, and www or not, exactly as the site serves it).
            response=$(curl -sS --max-time 320 -X POST -o body.json -w '%{http_code} %{redirect_url}' \
              -H "Authorization: Bearer ${CRON_SECRET}" "${url}")
            status="${response%% *}"
            body=$(cat body.json)
            echo "Attempt ${attempt}: HTTP ${status} ${body}"
            if [ "${status}" -ge 300 ] && [ "${status}" -lt 400 ]; then
              echo "::error::${SITE_URL} redirects to ${response#* }. Set the SITE_URL secret to that address (without the path)."
              exit 1
            fi
            if [ "${status}" != "200" ]; then
              echo "::error::HTTP ${status} from the reminders endpoint."
              exit 1
            fi
            remaining=$(echo "${body}" | jq -r '.remaining // 0')
            if [ "${DRY_RUN}" = "1" ] || [ "${remaining}" = "0" ]; then exit 0; fi
          done
          echo "::warning::Stopped with ${remaining} reminders still unsent."
